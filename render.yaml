services:
  - type: web
    name: neural-news
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neural-news-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: OPENAI_API_KEY
        sync: false  # set manually in Render dashboard

databases:
  - name: neural-news-db
    plan: free
    databaseName: neuralnews
    user: neuralnews
