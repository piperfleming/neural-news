<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neural News</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background: #eef6ef;
        color: #0f1f14;
      }

      body {
        margin: 0;
        padding: 32px 24px 64px;
        background: #eef6ef;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
      }

      header {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-bottom: 32px;
      }

      h1 {
        font-size: 1.5rem;
        margin: 0;
        font-weight: 600;
      }

      .brand-hero {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .brand-logo {
        width: 56px;
        height: 56px;
        object-fit: contain;
        background: transparent;
      }

      .brand-background img {
        width: 100%;
        height: 180px;
        border-radius: 16px;
        object-fit: cover;
      }

      .brand {
        font-weight: 800;
        color: #1f9d55;
        letter-spacing: 2px;
        text-transform: uppercase;
        font-size: 2.8rem;
        font-family: "Segoe UI", "Arial", sans-serif;
      }

      .subtitle {
        font-size: 1.05rem;
        color: #3f5a4a;
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        background: #f7fbf7;
        padding: 16px;
        border-radius: 16px;
        box-shadow: 0 12px 24px rgba(14, 36, 22, 0.08);
      }

      .filter-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .profile-button {
        margin-left: auto;
        background: #1f9d55;
        color: #ffffff;
        border: none;
        padding: 9px 16px;
        border-radius: 999px;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.9rem;
      }

      .filter-button {
        background: #e1f3e6;
        color: #1a6a3a;
        border: 1px solid transparent;
        padding: 8px 14px;
        border-radius: 999px;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.9rem;
      }

      .filter-button.active {
        background: #1f9d55;
        color: #ffffff;
        border-color: #1f9d55;
      }

      .tag-hint {
        font-size: 0.85rem;
        color: #4b6b57;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
      }

      .card {
        background: #ffffff;
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 16px 30px rgba(14, 36, 22, 0.08);
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .card-header {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logo-img {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: #edf0ff;
        object-fit: cover;
      }

      .hero-images {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
        margin-top: 12px;
      }

      .hero-images img {
        width: 100%;
        height: 180px;
        border-radius: 16px;
        object-fit: cover;
        background: #e8ecff;
      }

      .org {
        font-size: 0.85rem;
        color: #6b7280;
      }

      .title {
        font-size: 1.1rem;
        margin: 6px 0 0;
      }

      .summary {
        color: #3f5a4a;
        font-size: 0.95rem;
        line-height: 1.4;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        font-size: 0.85rem;
        color: #567563;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .tag {
        background: #e1f3e6;
        color: #1a6a3a;
        font-size: 0.8rem;
        padding: 4px 10px;
        border-radius: 999px;
        cursor: pointer;
      }

      .tag.featured {
        background: #0f1f14;
        color: #ffffff;
      }

      .cta {
        margin-top: auto;
      }

      .cta a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 9px 14px;
        background: #1f9d55;
        color: #ffffff;
        text-decoration: none;
        border-radius: 10px;
        font-size: 0.9rem;
        font-weight: 600;
      }

      .empty {
        text-align: center;
        padding: 40px 12px;
        color: #567563;
      }

      .modal {
        position: fixed;
        inset: 0;
        background: rgba(15, 31, 20, 0.55);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        z-index: 100;
      }

      .modal.open {
        display: flex;
      }

      .modal-card {
        width: min(520px, 100%);
        background: #ffffff;
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 20px 40px rgba(14, 36, 22, 0.2);
      }

      .modal-card h2 {
        margin: 0 0 8px;
        font-size: 1.3rem;
        color: #0f1f14;
      }

      .modal-card p {
        margin: 0 0 16px;
        color: #4b6b57;
      }

      .form-row {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 16px;
      }

      .form-row label {
        font-weight: 600;
        color: #1a6a3a;
      }

      .form-row select,
      .form-row input[type="text"] {
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #cfe4d4;
        font-size: 0.95rem;
      }

      .checkbox-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 8px 12px;
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
      }

      .modal-actions button {
        padding: 9px 16px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        font-weight: 600;
      }

      .modal-actions .secondary {
        background: #e1f3e6;
        color: #1a6a3a;
      }

      .modal-actions .primary {
        background: #1f9d55;
        color: #ffffff;
      }

      /* --- URL Ingest bar --- */
      .url-ingest {
        background: #f7fbf7;
        padding: 16px;
        border-radius: 16px;
        box-shadow: 0 12px 24px rgba(14, 36, 22, 0.08);
      }

      .url-ingest form {
        display: flex;
        gap: 10px;
      }

      .url-ingest input[type="url"] {
        flex: 1;
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid #cfe4d4;
        font-size: 0.95rem;
        outline: none;
        font-family: inherit;
      }

      .url-ingest input[type="url"]:focus {
        border-color: #1f9d55;
        box-shadow: 0 0 0 3px rgba(31, 157, 85, 0.15);
      }

      .url-ingest button {
        background: #1f9d55;
        color: #fff;
        border: none;
        padding: 10px 20px;
        border-radius: 999px;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.9rem;
        white-space: nowrap;
        font-family: inherit;
      }

      .url-ingest button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .ingest-status {
        margin-top: 10px;
        font-size: 0.9rem;
        color: #3f5a4a;
      }

      .ingest-status.error {
        color: #c0392b;
      }

      .ingest-status.success {
        color: #1f9d55;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="brand-hero">
          <img class="brand-logo" src="/static/n2%20logo.png" alt="Neural News logo" />
          <span class="brand">Neural News</span>
        </div>
        <div class="brand-background">
          <img src="/static/home_banner.jpg" alt="Neural News background" />
        </div>
        <h1 id="greeting">Hi! What AI news are you looking for?</h1>
        <p class="subtitle">
          Filter by tags to instantly refine the latest AI headlines.
        </p>
        <div class="url-ingest">
          <form id="ingestForm">
            <input
              type="url"
              id="articleUrl"
              placeholder="Paste an article URL to add it to the feed..."
              required
            />
            <button type="submit" id="ingestBtn">Add Article</button>
          </form>
          <div id="ingestStatus" class="ingest-status" hidden></div>
        </div>
        <div class="filters">
          <div id="filterButtons" class="filter-buttons"></div>
          <span class="tag-hint">Tap a tag to filter the feed.</span>
          <a id="accountLink" href="/account" class="profile-button" style="text-decoration:none;">
            Log In / Sign Up
          </a>
        </div>
      </header>

      <div id="profileModal" class="modal" aria-hidden="true">
        <div class="modal-card">
          <h2>Tell us about you</h2>
          <p>We will match articles to your role and AI needs.</p>
          <form id="profileForm">
            <div class="form-row">
              <label for="jobSelect">Your job or role</label>
              <select id="jobSelect" required>
                <option value="">Select one...</option>
                <option value="Founder">Founder / Executive</option>
                <option value="Engineer">Engineer / Developer</option>
                <option value="Researcher">Researcher</option>
                <option value="Policy">Policy / Legal</option>
                <option value="Security">Security</option>
                <option value="Product">Product / Design</option>
                <option value="Marketing">Marketing / Sales</option>
                <option value="Educator">Educator</option>
              </select>
            </div>
            <div class="form-row">
              <label>AI needs</label>
              <div class="checkbox-grid">
                <label><input type="checkbox" value="Governance" /> Governance & policy</label>
                <label><input type="checkbox" value="Models" /> Model updates</label>
                <label><input type="checkbox" value="Security" /> Security & misuse</label>
                <label><input type="checkbox" value="Infrastructure" /> Hardware & infrastructure</label>
                <label><input type="checkbox" value="Research" /> Research insights</label>
                <label><input type="checkbox" value="Companies" /> Company moves</label>
              </div>
            </div>
            <div class="modal-actions">
              <button type="button" id="closeProfile" class="secondary">Cancel</button>
              <button type="submit" class="primary">Apply filters</button>
            </div>
          </form>
        </div>
      </div>

      <section>
        <div id="feed" class="grid"></div>
        <div id="emptyState" class="empty" hidden>
          No articles found for those tags.
        </div>
      </section>
    </div>

    <script>
      const feed = document.getElementById("feed");
      const emptyState = document.getElementById("emptyState");
      const filterButtons = document.getElementById("filterButtons");
      const profileModal = document.getElementById("profileModal");
      const closeProfile = document.getElementById("closeProfile");
      const profileForm = document.getElementById("profileForm");
      const jobSelect = document.getElementById("jobSelect");

      const filterOptions = [
        { label: "All", tags: [] },
        { label: "Research", tags: ["Research"] },
        { label: "Policy", tags: ["Policy"] },
        { label: "Models", tags: ["Models"] },
        { label: "Companies", tags: ["Companies"] },
        { label: "Hardware/Infrastructure", tags: ["Hardware", "Infrastructure"] },
        { label: "Security/Misuse", tags: ["Security", "Misuse"] },
      ];

      const buildTagParams = (tags) =>
        tags.length ? `?tags=${encodeURIComponent(tags.join(","))}` : "";

      const renderArticles = (articles) => {
        feed.innerHTML = "";
        if (!articles.length) {
          emptyState.hidden = false;
          return;
        }
        emptyState.hidden = true;

        articles.forEach((article) => {
          const card = document.createElement("article");
          card.className = "card";
          card.innerHTML = `
            <div class="card-header">
              <!-- Replace logo_url in frontend.py with the publisher's logo URL -->
              <img class="logo-img" src="${article.logo_url}" alt="${article.org} logo" />
              <div>
                <div class="org">${article.org}</div>
                <h2 class="title">${article.title}</h2>
              </div>
            </div>
            <p class="summary">${article.summary}</p>
            <div class="meta">
              <span>${article.date}</span>
              <span>•</span>
              <span>${article.author}</span>
            </div>
            <div class="tags">
              ${article.tags
                .map((tag) => {
                  const lower = tag.toLowerCase();
                  const isFeatured =
                    lower === "reader favorite" || lower === "editors choice";
                  const label = isFeatured ? `⭐ ${tag}` : tag;
                  return `<span class="tag${isFeatured ? " featured" : ""}" data-tag="${tag}">${label}</span>`;
                })
                .join("")}
            </div>
            <div class="cta">
              <a href="${article.url}" target="_blank" rel="noreferrer">Read article</a>
            </div>
          `;
          feed.appendChild(card);
        });

        document.querySelectorAll(".tag").forEach((tagEl) => {
          tagEl.addEventListener("click", () => {
            setActiveFilter([tagEl.dataset.tag]);
            fetchArticles([tagEl.dataset.tag]);
          });
        });
      };

      const fetchArticles = async (tags = []) => {
        const response = await fetch(`/api/articles${buildTagParams(tags)}`);
        const data = await response.json();
        renderArticles(data.articles);
      };

      const setActiveFilter = (tags) => {
        const normalized = tags.map((tag) => tag.toLowerCase());
        document.querySelectorAll(".filter-button").forEach((button) => {
          const buttonTags = button.dataset.tags
            ? button.dataset.tags.split("|")
            : [];
          const isActive =
            buttonTags.length === 0
              ? normalized.length === 0
              : buttonTags.every((tag) => normalized.includes(tag));
          button.classList.toggle("active", isActive);
        });
      };

      const applyProfileFilter = (tags) => {
        setActiveFilter([]);
        fetchArticles(tags);
      };

      const buildFilterButtons = () => {
        filterButtons.innerHTML = "";
        filterOptions.forEach((option) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "filter-button";
          button.textContent = option.label;
          button.dataset.tags = option.tags.join("|");
          button.addEventListener("click", () => {
            setActiveFilter(option.tags);
            fetchArticles(option.tags);
          });
          filterButtons.appendChild(button);
        });
      };

      const roleTagMap = {
        Founder: ["Companies", "Policy"],
        Engineer: ["Models", "Hardware", "Infrastructure"],
        Researcher: ["Research", "Models"],
        Policy: ["Policy"],
        Security: ["Security", "Misuse"],
        Product: ["Models", "Companies"],
        Marketing: ["Companies"],
        Educator: ["Research"],
      };

      const needTagMap = {
        Governance: ["Policy"],
        Models: ["Models"],
        Security: ["Security", "Misuse"],
        Infrastructure: ["Hardware", "Infrastructure"],
        Research: ["Research"],
        Companies: ["Companies"],
      };

      const openModal = () => {
        profileModal.classList.add("open");
        profileModal.setAttribute("aria-hidden", "false");
      };

      const closeModal = () => {
        profileModal.classList.remove("open");
        profileModal.setAttribute("aria-hidden", "true");
      };

      closeProfile.addEventListener("click", closeModal);
      profileModal.addEventListener("click", (event) => {
        if (event.target === profileModal) {
          closeModal();
        }
      });

      profileForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const tags = new Set();
        const role = jobSelect.value;
        (roleTagMap[role] || []).forEach((tag) => tags.add(tag));

        profileForm
          .querySelectorAll('input[type="checkbox"]:checked')
          .forEach((input) => {
            (needTagMap[input.value] || []).forEach((tag) => tags.add(tag));
          });

        applyProfileFilter(Array.from(tags));
        closeModal();
      });

      // --- URL Ingest ---
      const ingestForm = document.getElementById("ingestForm");
      const articleUrl = document.getElementById("articleUrl");
      const ingestBtn = document.getElementById("ingestBtn");
      const ingestStatus = document.getElementById("ingestStatus");

      ingestForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const url = articleUrl.value.trim();
        if (!url) return;

        // Show loading state
        ingestBtn.disabled = true;
        ingestBtn.textContent = "Processing\u2026";
        ingestStatus.hidden = false;
        ingestStatus.className = "ingest-status";
        ingestStatus.textContent =
          "Fetching article and running AI analysis \u2014 this may take a few seconds\u2026";

        try {
          const response = await fetch("/api/articles/ingest", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url }),
          });

          if (response.status === 409) {
            throw new Error("This article has already been added.");
          }
          if (response.status === 429) {
            throw new Error(
              "Rate limit reached. Please wait a minute and try again."
            );
          }
          if (!response.ok) {
            const err = await response.json();
            throw new Error(err.detail || "Failed to process article.");
          }

          ingestStatus.className = "ingest-status success";
          ingestStatus.textContent = "Article added successfully!";
          articleUrl.value = "";

          // Refresh feed to show the new article
          setActiveFilter([]);
          fetchArticles([]);
        } catch (error) {
          ingestStatus.className = "ingest-status error";
          ingestStatus.textContent = error.message;
        } finally {
          ingestBtn.disabled = false;
          ingestBtn.textContent = "Add Article";
        }
      });

      // --- Auth-aware personalization ---
      const nnToken = localStorage.getItem("nn_token");
      if (nnToken) {
        fetch("/api/auth/me", {
          headers: { "Authorization": `Bearer ${nnToken}` },
        })
          .then((res) => (res.ok ? res.json() : Promise.reject()))
          .then((user) => {
            const firstName = user.name.split(" ")[0];
            document.getElementById("greeting").textContent =
              `Hi, ${firstName}! What AI news are you looking for?`;
            const link = document.getElementById("accountLink");
            link.textContent = firstName;
            link.title = "Your account";
          })
          .catch(() => {
            localStorage.removeItem("nn_token");
          });
      }

      buildFilterButtons();
      setActiveFilter([]);
      fetchArticles([]);
    </script>
  </body>
</html>
