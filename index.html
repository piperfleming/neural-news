<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neural News</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background: #eef6ef;
        color: #0f1f14;
      }

      body {
        margin: 0;
        padding: 16px 16px 64px;
        background: #eef6ef;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
      }

      header {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 16px;
      }

      .header-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 2px;
      }

      h1 {
        font-size: 1.5rem;
        margin: 0;
        font-weight: 600;
        min-height: 1.5em;
      }

      .typing-cursor {
        display: inline-block;
        font-weight: 300;
        animation: blink 0.7s step-end infinite;
      }

      h1.static .typing-cursor {
        display: none;
      }

      @keyframes blink {
        50% { opacity: 0; }
      }

      .brand-hero {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        margin: -4px 0 -8px 0;
      }

      .brand-logo {
        height: 72px;
        width: auto;
        object-fit: contain;
        background: transparent;
        display: block;
      }

      .brand-tagline {
        margin-top: 6px;
        margin-left: 8px;
        font-size: 1rem;
        font-weight: 700;
        color: #1a6a3a;
        font-family: Arial, sans-serif;
        text-align: left;
      }

      .brand-background {
        position: relative;
      }

      .brand-background img {
        width: 100%;
        height: 180px;
        border-radius: 16px;
        object-fit: cover;
      }

      .brand-background .banner-greeting {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 16px;
        color: #fff;
        font-size: 2rem;
        font-weight: 600;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        border-radius: 16px;
      }

      .brand {
        font-weight: 800;
        color: #1f9d55;
        letter-spacing: 2px;
        text-transform: uppercase;
        font-size: 2.8rem;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        background: #f7fbf7;
        padding: 16px;
        border-radius: 16px;
        box-shadow: 0 12px 24px rgba(14, 36, 22, 0.08);
      }

      .filter-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .profile-button {
        margin-left: auto;
        background: #1f9d55;
        color: #ffffff;
        border: none;
        padding: 9px 16px;
        border-radius: 999px;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.9rem;
      }

      .filter-button {
        background: #e1f3e6;
        color: #1a6a3a;
        border: 1px solid transparent;
        padding: 8px 14px;
        border-radius: 999px;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.9rem;
      }

      .filter-button.active {
        background: #1f9d55;
        color: #ffffff;
        border-color: #1f9d55;
      }

      .tag-hint {
        font-size: 0.85rem;
        color: #4b6b57;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
      }

      .card {
        background: #ffffff;
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 16px 30px rgba(14, 36, 22, 0.08);
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .card-header {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logo-img {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: #edf0ff;
        object-fit: cover;
      }

      .hero-images {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
        margin-top: 12px;
      }

      .hero-images img {
        width: 100%;
        height: 180px;
        border-radius: 16px;
        object-fit: cover;
        background: #e8ecff;
      }

      .org {
        font-size: 0.85rem;
        color: #6b7280;
      }

      .title {
        font-size: 1.1rem;
        margin: 6px 0 0;
      }

      .summary {
        color: #3f5a4a;
        font-size: 0.95rem;
        line-height: 1.4;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        font-size: 0.85rem;
        color: #567563;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .tag {
        background: #e1f3e6;
        color: #1a6a3a;
        font-size: 0.8rem;
        padding: 4px 10px;
        border-radius: 999px;
        cursor: pointer;
      }

      .tag.featured {
        background: #0f1f14;
        color: #ffffff;
      }

      .tag.active {
        background: #1f9d55;
        color: #ffffff;
      }

      .tag.featured.active {
        background: #1f9d55;
        color: #ffffff;
      }

      .cta {
        margin-top: auto;
      }

      .cta a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 9px 14px;
        background: #1f9d55;
        color: #ffffff;
        text-decoration: none;
        border-radius: 10px;
        font-size: 0.9rem;
        font-weight: 600;
      }

      .empty {
        text-align: center;
        padding: 40px 12px;
        color: #567563;
      }

      /* --- URL Ingest bar --- */
      .url-ingest {
        background: #f7fbf7;
        padding: 16px;
        border-radius: 16px;
        box-shadow: 0 12px 24px rgba(14, 36, 22, 0.08);
      }

      .url-ingest form {
        display: flex;
        gap: 10px;
      }

      .url-ingest input[type="url"] {
        flex: 1;
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid #cfe4d4;
        font-size: 0.95rem;
        outline: none;
        font-family: inherit;
      }

      .url-ingest input[type="url"]:focus {
        border-color: #1f9d55;
        box-shadow: 0 0 0 3px rgba(31, 157, 85, 0.15);
      }

      .url-ingest button {
        background: #1f9d55;
        color: #fff;
        border: none;
        padding: 10px 20px;
        border-radius: 999px;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.9rem;
        white-space: nowrap;
        font-family: inherit;
      }

      .url-ingest button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .ingest-status {
        margin-top: 10px;
        font-size: 0.9rem;
        color: #3f5a4a;
      }

      .ingest-status.error {
        color: #c0392b;
      }

      .ingest-status.success {
        color: #1f9d55;
        font-weight: 600;
      }

      /* --- Social Buzz --- */
      .buzz-section {
        background: linear-gradient(135deg, #0f1f14 0%, #1a4a2e 40%, #1f9d55 100%);
        border-radius: 18px;
        padding: 24px 28px;
        margin-bottom: 28px;
        box-shadow: 0 16px 30px rgba(14, 36, 22, 0.15);
      }

      .buzz-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .buzz-header h2 {
        font-size: 1.1rem;
        margin: 0;
        color: #fff;
        font-weight: 700;
        letter-spacing: 0.3px;
      }

      .buzz-refresh {
        background: rgba(255,255,255,0.15);
        color: #fff;
        border: 1px solid rgba(255,255,255,0.25);
        padding: 5px 12px;
        border-radius: 999px;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.75rem;
        backdrop-filter: blur(4px);
      }

      .buzz-refresh:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .buzz-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .buzz-item {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 10px 14px;
        background: rgba(255,255,255,0.08);
        border-radius: 12px;
        backdrop-filter: blur(4px);
        transition: background 0.15s;
      }

      .buzz-item:hover {
        background: rgba(255,255,255,0.14);
      }

      .buzz-sentiment-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-top: 6px;
        flex-shrink: 0;
      }

      .buzz-sentiment-dot.excited { background: #4ade80; }
      .buzz-sentiment-dot.concerned { background: #fbbf24; }
      .buzz-sentiment-dot.divided { background: #f87171; }
      .buzz-sentiment-dot.curious { background: #60a5fa; }
      .buzz-sentiment-dot.skeptical { background: #c084fc; }

      .buzz-item-content {
        flex: 1;
        min-width: 0;
      }

      .buzz-headline {
        font-size: 0.9rem;
        font-weight: 600;
        color: #fff;
        margin: 0 0 3px;
      }

      .buzz-summary {
        font-size: 0.8rem;
        color: rgba(255,255,255,0.7);
        line-height: 1.35;
        margin: 0;
      }

      .buzz-item-meta {
        display: flex;
        gap: 5px;
        margin-top: 5px;
        flex-wrap: wrap;
      }

      .buzz-source {
        font-size: 0.65rem;
        padding: 1px 7px;
        border-radius: 999px;
        background: rgba(255,255,255,0.12);
        color: rgba(255,255,255,0.65);
        font-weight: 500;
      }

      .buzz-tag {
        font-size: 0.65rem;
        padding: 1px 7px;
        border-radius: 999px;
        background: rgba(31,157,85,0.3);
        color: rgba(255,255,255,0.8);
        font-weight: 500;
      }

      .buzz-loading {
        text-align: center;
        padding: 16px;
        color: rgba(255,255,255,0.6);
        font-size: 0.85rem;
      }

      /* --- Animated Transitions --- */
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(18px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .card {
        opacity: 0;
        animation: fadeInUp 0.4s ease-out forwards;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 20px 40px rgba(14, 36, 22, 0.14);
      }

      .buzz-item {
        opacity: 0;
        animation: fadeInUp 0.35s ease-out forwards;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="header-top">
          <div class="brand-hero">
            <img class="brand-logo" src="/static/neural-news-logo.png?v=2" alt="N²eural News" />
            <p class="brand-tagline"><strong>Exponential news. Constant time understanding.</strong></p>
          </div>
          <a id="accountLink" href="/account" class="profile-button" style="text-decoration:none;">
            Log In / Sign Up
          </a>
        </div>
        <div class="brand-background">
          <img src="/static/home_banner.jpg" alt="Neural News background" />
          <h1 id="greeting" class="banner-greeting"><span id="greetingText"></span><span id="greetingCursor" class="typing-cursor" aria-hidden="true">|</span></h1>
        </div>
        <div class="url-ingest">
          <form id="ingestForm">
            <input
              type="url"
              id="articleUrl"
              placeholder="Paste an article URL to add it to the feed..."
              required
            />
            <button type="submit" id="ingestBtn">Add Article</button>
          </form>
          <div id="ingestStatus" class="ingest-status" hidden></div>
        </div>
        <div class="filters">
          <div id="filterButtons" class="filter-buttons"></div>
          <span class="tag-hint">Tap a tag to filter the feed.</span>
        </div>
      </header>

      <section class="buzz-section">
        <div class="buzz-header">
          <h2>What People Are Saying</h2>
          <button class="buzz-refresh" id="buzzRefresh" onclick="loadBuzz()">Refresh</button>
        </div>
        <div id="buzzContent">
          <div class="buzz-loading">Loading social buzz...</div>
        </div>
      </section>

      <section>
        <div id="feed" class="grid"></div>
        <div id="emptyState" class="empty" hidden>
          No articles found for those tags.
        </div>
      </section>
    </div>

    <script>
      const feed = document.getElementById("feed");
      const emptyState = document.getElementById("emptyState");
      const filterButtons = document.getElementById("filterButtons");
      const accountLink = document.getElementById("accountLink");

      const filterOptions = [
        { label: "All", tags: [] },
        { label: "Research", tags: ["Research"] },
        { label: "Policy", tags: ["Policy"] },
        { label: "Models", tags: ["Models"] },
        { label: "Companies", tags: ["Companies"] },
        { label: "Hardware/Infrastructure", tags: ["Hardware", "Infrastructure"] },
        { label: "Security/Misuse", tags: ["Security", "Misuse"] },
      ];

      const buildTagParams = (tags) =>
        tags.length ? `?tags=${encodeURIComponent(tags.join(","))}` : "";

      const renderArticles = (articles, activeFilterTags = []) => {
        feed.innerHTML = "";
        if (!articles.length) {
          emptyState.hidden = false;
          return;
        }
        emptyState.hidden = true;

        articles.forEach((article, index) => {
          const card = document.createElement("article");
          card.className = "card";
          card.style.animationDelay = `${index * 0.05}s`;
          card.innerHTML = `
            <div class="card-header">
              <!-- Replace logo_url in frontend.py with the publisher's logo URL -->
              <img class="logo-img" src="${article.logo_url}" alt="${article.org} logo" />
              <div>
                <div class="org">${article.org}</div>
                <h2 class="title">${article.title}</h2>
              </div>
            </div>
            <p class="summary">${article.summary}</p>
            <div class="meta">
              <span>${article.date}</span>
              <span>•</span>
              <span>${article.author}</span>
            </div>
            <div class="tags">
              ${article.tags
                .map((tag) => {
                  const lower = tag.toLowerCase();
                  const isFeatured =
                    lower === "reader favorite" || lower === "editors choice";
                  const isActive =
                    activeFilterTags.length > 0 &&
                    activeFilterTags.some((t) => t.toLowerCase() === lower);
                  const label = isFeatured ? `⭐ ${tag}` : tag;
                  return `<span class="tag${isFeatured ? " featured" : ""}${isActive ? " active" : ""}" data-tag="${tag}">${label}</span>`;
                })
                .join("")}
            </div>
            <div class="cta">
              <a href="${article.url}" target="_blank" rel="noreferrer">Read article</a>
            </div>
          `;
          feed.appendChild(card);
        });

        document.querySelectorAll(".tag").forEach((tagEl) => {
          tagEl.addEventListener("click", () => {
            setActiveFilter([tagEl.dataset.tag]);
            fetchArticles([tagEl.dataset.tag]);
          });
        });
      };

      const fetchArticles = async (tags = []) => {
        const response = await fetch(`/api/articles${buildTagParams(tags)}`);
        const data = await response.json();
        renderArticles(data.articles, tags);
      };

      const setActiveFilter = (tags) => {
        const normalized = tags.map((tag) => tag.toLowerCase());
        document.querySelectorAll(".filter-button").forEach((button) => {
          const buttonTags = button.dataset.tags
            ? button.dataset.tags.split("|")
            : [];
          const isActive =
            buttonTags.length === 0
              ? normalized.length === 0
              : buttonTags.every((tag) => normalized.includes(tag.toLowerCase()));
          button.classList.toggle("active", isActive);
        });
      };

      const buildFilterButtons = () => {
        filterButtons.innerHTML = "";
        filterOptions.forEach((option) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "filter-button";
          button.textContent = option.label;
          button.dataset.tags = option.tags.join("|");
          button.addEventListener("click", () => {
            setActiveFilter(option.tags);
            fetchArticles(option.tags);
          });
          filterButtons.appendChild(button);
        });
      };

      // --- URL Ingest ---
      const ingestForm = document.getElementById("ingestForm");
      const articleUrl = document.getElementById("articleUrl");
      const ingestBtn = document.getElementById("ingestBtn");
      const ingestStatus = document.getElementById("ingestStatus");

      ingestForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const url = articleUrl.value.trim();
        if (!url) return;

        // Show loading state
        ingestBtn.disabled = true;
        ingestBtn.textContent = "Processing\u2026";
        ingestStatus.hidden = false;
        ingestStatus.className = "ingest-status";
        ingestStatus.textContent =
          "Fetching article and running AI analysis \u2014 this may take a few seconds\u2026";

        try {
          const response = await fetch("/api/articles/ingest", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url }),
          });

          if (response.status === 409) {
            throw new Error("This article has already been added.");
          }
          if (response.status === 429) {
            throw new Error(
              "Rate limit reached. Please wait a minute and try again."
            );
          }
          if (!response.ok) {
            const err = await response.json();
            throw new Error(err.detail || "Failed to process article.");
          }

          ingestStatus.className = "ingest-status success";
          ingestStatus.textContent = "Article added successfully!";
          articleUrl.value = "";

          // Refresh feed to show the new article
          setActiveFilter([]);
          fetchArticles([]);
        } catch (error) {
          ingestStatus.className = "ingest-status error";
          ingestStatus.textContent = error.message;
        } finally {
          ingestBtn.disabled = false;
          ingestBtn.textContent = "Add Article";
        }
      });

      // --- Typewriter greeting & subtitle ---
      function runTypewriter(text, speedMs, onDone) {
        if (typeof speedMs !== "number") speedMs = 55;
        const greetingEl = document.getElementById("greeting");
        const textEl = document.getElementById("greetingText");
        const cursorEl = document.getElementById("greetingCursor");
        if (!textEl || !cursorEl) return;
        textEl.textContent = "";
        greetingEl.classList.remove("static");
        let i = 0;
        function type() {
          if (i < text.length) {
            textEl.textContent += text[i];
            i++;
            setTimeout(type, speedMs);
          } else {
            greetingEl.classList.add("static");
            if (typeof onDone === "function") onDone();
          }
        }
        type();
      }

      const defaultGreeting = "Hello, what AI news are you looking for?";
      function startGreetingTypewriter(message) {
        runTypewriter(message, 55);
      }

      // --- Social Buzz ---
      const buzzContent = document.getElementById("buzzContent");
      const buzzRefresh = document.getElementById("buzzRefresh");

      const renderBuzz = (data) => {
        const topics = data.topics || [];
        if (!topics.length) {
          buzzContent.innerHTML = '<div class="buzz-loading">No social buzz found right now.</div>';
          return;
        }

        const list = document.createElement("ul");
        list.className = "buzz-list";

        topics.forEach((topic, index) => {
          const sources = (topic.sources || [])
            .map((s) => `<span class="buzz-source">${s}</span>`)
            .join("");
          const tags = (topic.tags || [])
            .map((t) => `<span class="buzz-tag">${t}</span>`)
            .join("");
          const li = document.createElement("li");
          li.className = "buzz-item";
          li.style.animationDelay = `${index * 0.05}s`;
          li.innerHTML = `
            <span class="buzz-sentiment-dot ${topic.sentiment || ""}"></span>
            <div class="buzz-item-content">
              <p class="buzz-headline">${topic.headline}</p>
              <p class="buzz-summary">${topic.summary}</p>
              <div class="buzz-item-meta">${sources}${tags}</div>
            </div>
          `;
          list.appendChild(li);
        });

        buzzContent.innerHTML = "";
        buzzContent.appendChild(list);
      };

      let userBuzzTopics = [];

      const loadBuzz = async (topics) => {
        const buzzTopics = topics || userBuzzTopics;
        buzzRefresh.disabled = true;
        buzzRefresh.textContent = "Loading...";
        buzzContent.innerHTML = '<div class="buzz-loading">Searching social media and summarizing with AI...</div>';

        const params = buzzTopics.length
          ? `?topics=${encodeURIComponent(buzzTopics.map(t => `AI ${t}`).join(","))}`
          : "";

        try {
          const res = await fetch(`/api/buzz${params}`);
          if (!res.ok) throw new Error("Failed to load buzz");
          const data = await res.json();
          renderBuzz(data);
        } catch (err) {
          buzzContent.innerHTML = '<div class="buzz-loading">Could not load social buzz.</div>';
        } finally {
          buzzRefresh.disabled = false;
          buzzRefresh.textContent = "Refresh";
        }
      };

      // --- Auth-aware personalization ---
      const nnToken = localStorage.getItem("nn_token");

      buildFilterButtons();

      if (nnToken) {
        fetch("/api/auth/me", {
          headers: { "Authorization": `Bearer ${nnToken}` },
        })
          .then((res) => (res.ok ? res.json() : Promise.reject()))
          .then((user) => {
            const firstName = user.name.split(" ")[0];
            const link = document.getElementById("accountLink");
            link.textContent = firstName;
            link.title = "Your account";
            startGreetingTypewriter(`Hello, ${firstName}! What AI news are you looking for?`);
            const prefs = user.preferred_tags || [];
            if (prefs.length > 0) {
              setActiveFilter(prefs);
              fetchArticles(prefs);
            } else {
              setActiveFilter([]);
              fetchArticles([]);
            }
            userBuzzTopics = prefs;
            if (prefs.length > 0) {
              document.querySelector(".buzz-header h2").textContent = "Your AI Buzz";
            }
            loadBuzz();
          })
          .catch(() => {
            localStorage.removeItem("nn_token");
            startGreetingTypewriter(defaultGreeting);
            setActiveFilter([]);
            fetchArticles([]);
            loadBuzz();
          });
      } else {
        startGreetingTypewriter(defaultGreeting);
        setActiveFilter([]);
        fetchArticles([]);
        loadBuzz();
      }
    </script>
  </body>
</html>
