<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Dashboard — Neural News</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background: #eef6ef;
        color: #0f1f14;
      }

      body {
        margin: 0;
        padding: 16px 16px 64px;
        background: #eef6ef;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      /* ── Header ── */
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 28px;
      }

      .brand-hero {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-logo {
        height: 52px;
        width: auto;
        object-fit: contain;
        display: block;
      }

      .brand-tagline {
        margin: 0;
        font-size: 0.9rem;
        font-weight: 700;
        color: #1a6a3a;
        font-family: Arial, sans-serif;
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: #1f9d55;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        padding: 8px 16px;
        border-radius: 999px;
        background: #e1f3e6;
        transition: background 0.15s;
      }

      .back-link:hover {
        background: #1f9d55;
        color: #fff;
      }

      .page-title {
        font-size: 1.5rem;
        font-weight: 700;
        margin: 0 0 4px;
        color: #0f1f14;
      }

      .page-subtitle {
        font-size: 0.875rem;
        color: #4b6b57;
        margin: 0;
      }

      /* ── Days filter ── */
      .days-filter {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 24px;
        flex-wrap: wrap;
      }

      .days-filter span {
        font-size: 0.875rem;
        color: #4b6b57;
        font-weight: 600;
        margin-right: 4px;
      }

      .day-btn {
        background: #e1f3e6;
        color: #1a6a3a;
        border: 1px solid transparent;
        padding: 7px 18px;
        border-radius: 999px;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.875rem;
        font-family: inherit;
        transition: background 0.15s;
      }

      .day-btn.active {
        background: #1f9d55;
        color: #fff;
        border-color: #1f9d55;
      }

      .day-btn:hover:not(.active) {
        background: #c5e8cf;
      }

      /* ── Section headings ── */
      .section-title {
        font-size: 1.05rem;
        font-weight: 700;
        color: #0f1f14;
        margin: 0 0 14px;
        padding-bottom: 8px;
        border-bottom: 2px solid #c5e8cf;
      }

      /* ── Stat cards ── */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 14px;
        margin-bottom: 28px;
      }

      .stat-card {
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 16px 30px rgba(14, 36, 22, 0.08);
        padding: 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .stat-label {
        font-size: 0.78rem;
        font-weight: 600;
        color: #4b6b57;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .stat-value {
        font-size: 1.9rem;
        font-weight: 800;
        color: #1f9d55;
        line-height: 1.1;
      }

      .stat-sub {
        font-size: 0.78rem;
        color: #7a9e87;
        margin-top: 2px;
      }

      /* ── Two-column layout ── */
      .two-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 28px;
      }

      @media (max-width: 700px) {
        .two-col { grid-template-columns: 1fr; }
      }

      .panel {
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 16px 30px rgba(14, 36, 22, 0.08);
        padding: 20px 22px;
      }

      /* ── CSS bar chart ── */
      .bar-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .bar-item {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .bar-label-row {
        display: flex;
        justify-content: space-between;
        font-size: 0.82rem;
        font-weight: 600;
        color: #1a6a3a;
      }

      .bar-track {
        background: #eef6ef;
        border-radius: 999px;
        height: 8px;
        overflow: hidden;
      }

      .bar-fill {
        background: #1f9d55;
        height: 100%;
        border-radius: 999px;
        transition: width 0.4s ease;
      }

      /* ── Ranked article list ── */
      .article-rank-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .article-rank-item {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        font-size: 0.85rem;
      }

      .rank-num {
        font-size: 0.75rem;
        font-weight: 800;
        color: #1f9d55;
        min-width: 18px;
        padding-top: 1px;
      }

      .rank-title {
        flex: 1;
        color: #0f1f14;
        line-height: 1.35;
      }

      .rank-meta {
        display: flex;
        gap: 8px;
        font-size: 0.75rem;
        color: #7a9e87;
        white-space: nowrap;
        padding-top: 1px;
      }

      /* ── User table ── */
      .table-wrap {
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 16px 30px rgba(14, 36, 22, 0.08);
        overflow: hidden;
        margin-bottom: 28px;
      }

      .table-header {
        padding: 16px 20px 12px;
        border-bottom: 1px solid #eef6ef;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.875rem;
      }

      thead th {
        background: #f7fbf7;
        padding: 10px 14px;
        text-align: left;
        font-size: 0.78rem;
        font-weight: 700;
        color: #4b6b57;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        border-bottom: 1px solid #e1f3e6;
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }

      thead th:hover {
        background: #e1f3e6;
        color: #1a6a3a;
      }

      thead th.sort-asc::after { content: " ↑"; }
      thead th.sort-desc::after { content: " ↓"; }

      tbody tr {
        cursor: pointer;
        transition: background 0.1s;
      }

      tbody tr:hover {
        background: #f7fbf7;
      }

      tbody tr.expanded {
        background: #f0f8f1;
      }

      tbody td {
        padding: 10px 14px;
        border-bottom: 1px solid #f0f8f1;
        vertical-align: middle;
      }

      tbody tr:last-child td {
        border-bottom: none;
      }

      .role-badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }

      .role-badge.admin {
        background: #fde8d0;
        color: #8a4500;
      }

      .role-badge.user {
        background: #e1f3e6;
        color: #1a6a3a;
      }

      /* ── Inline detail panel ── */
      .detail-row td {
        padding: 0;
        border-bottom: 2px solid #1f9d55;
      }

      .detail-panel {
        padding: 18px 20px;
        background: #f7fbf7;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 20px;
      }

      @media (max-width: 900px) {
        .detail-panel { grid-template-columns: 1fr 1fr; }
      }

      @media (max-width: 600px) {
        .detail-panel { grid-template-columns: 1fr; }
      }

      .detail-section-title {
        font-size: 0.8rem;
        font-weight: 700;
        color: #4b6b57;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        margin: 0 0 10px;
      }

      /* ── Daily activity mini-chart ── */
      .mini-chart {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 48px;
        margin-top: 4px;
      }

      .mini-bar {
        flex: 1;
        background: #1f9d55;
        border-radius: 3px 3px 0 0;
        min-height: 2px;
        transition: height 0.3s;
        position: relative;
      }

      .mini-bar:hover::after {
        content: attr(data-tip);
        position: absolute;
        bottom: calc(100% + 4px);
        left: 50%;
        transform: translateX(-50%);
        background: #0f1f14;
        color: #fff;
        font-size: 0.72rem;
        padding: 3px 6px;
        border-radius: 6px;
        white-space: nowrap;
        pointer-events: none;
        z-index: 10;
      }

      /* ── Session list ── */
      .session-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 180px;
        overflow-y: auto;
      }

      .session-item {
        font-size: 0.8rem;
        color: #0f1f14;
        background: #fff;
        border-radius: 8px;
        padding: 6px 10px;
        border: 1px solid #e1f3e6;
      }

      .session-item .session-time {
        color: #4b6b57;
        font-size: 0.75rem;
      }

      /* ── Loading / error states ── */
      .loading {
        text-align: center;
        padding: 32px;
        color: #4b6b57;
        font-size: 0.9rem;
      }

      .error-msg {
        background: #fff3f3;
        color: #a00;
        border-radius: 10px;
        padding: 16px 20px;
        font-size: 0.9rem;
        margin-bottom: 16px;
      }

      .empty-row td {
        text-align: center;
        color: #7a9e87;
        padding: 24px;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <div class="container">

      <!-- ── Header ── -->
      <header>
        <div class="brand-hero">
          <img class="brand-logo" src="/static/neural-news-logo.png?v=2" alt="N²eural News" />
          <p class="brand-tagline"><strong>Exponential news. Constant time understanding.</strong></p>
        </div>
        <a href="/" class="back-link">&#8592; Back to Feed</a>
      </header>

      <div style="margin-bottom: 20px;">
        <p class="page-title">Admin Dashboard</p>
        <p class="page-subtitle">Platform metrics and user activity overview.</p>
      </div>

      <!-- ── Error banner ── -->
      <div id="errorBanner" class="error-msg" hidden></div>

      <!-- ── Days filter ── -->
      <div class="days-filter">
        <span>Period:</span>
        <button class="day-btn active" data-days="7">7d</button>
        <button class="day-btn" data-days="30">30d</button>
        <button class="day-btn" data-days="90">90d</button>
      </div>

      <!-- ── Section 1: Summary Stats ── -->
      <p class="section-title">Platform Summary</p>
      <div class="stats-grid" id="statsGrid">
        <div class="loading">Loading…</div>
      </div>

      <!-- ── Section 2: Top Tags + Top Articles ── -->
      <div class="two-col" id="twoCol" hidden>
        <div class="panel">
          <p class="section-title" style="border:none;margin-bottom:14px;">Top Tags</p>
          <ul class="bar-list" id="topTagsList"></ul>
        </div>
        <div class="panel">
          <p class="section-title" style="border:none;margin-bottom:14px;">Top Articles</p>
          <ol class="article-rank-list" id="topArticlesList"></ol>
        </div>
      </div>

      <!-- ── Section 3: User Table ── -->
      <p class="section-title">Users</p>
      <div class="table-wrap">
        <div id="tableBody">
          <div class="loading">Loading users…</div>
        </div>
      </div>

    </div>

    <script>
      const token = localStorage.getItem("nn_token");

      // ── Auth gate ──────────────────────────────────────────────────
      if (!token) {
        location.replace("/");
      }

      function authHeaders() {
        return { "Authorization": `Bearer ${token}` };
      }

      // ── State ──────────────────────────────────────────────────────
      let currentDays = 7;
      let usersData = [];
      let sortKey = "total_active_seconds";
      let sortDir = "desc";
      let expandedUserId = null;

      // ── Days filter buttons ────────────────────────────────────────
      document.querySelectorAll(".day-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".day-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          currentDays = parseInt(btn.dataset.days, 10);
          loadAll();
        });
      });

      // ── Load everything ────────────────────────────────────────────
      async function loadAll() {
        expandedUserId = null;
        await Promise.all([loadSummary(), loadUsers()]);
      }

      // ── Summary ────────────────────────────────────────────────────
      async function loadSummary() {
        const statsGrid = document.getElementById("statsGrid");
        const twoCol = document.getElementById("twoCol");
        statsGrid.innerHTML = '<div class="loading">Loading…</div>';
        twoCol.hidden = true;

        let data;
        try {
          const res = await fetch(`/api/metrics/admin/summary?days=${currentDays}`, {
            headers: authHeaders(),
          });
          if (res.status === 403) {
            showError("Access denied. Admin privileges required.");
            location.replace("/");
            return;
          }
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          data = await res.json();
        } catch (err) {
          statsGrid.innerHTML = `<div class="error-msg">Failed to load summary: ${err.message}</div>`;
          return;
        }

        renderStats(data);
        renderTopTags(data.top_tags || []);
        renderTopArticles(data.top_articles || []);
        twoCol.hidden = false;
      }

      function renderStats(d) {
        const grid = document.getElementById("statsGrid");
        const cards = [
          { label: "Total Users",     value: fmt(d.total_users),       sub: "all time" },
          { label: `New Users`,       value: fmt(d.new_users),          sub: `last ${d.days}d` },
          { label: "Active (24h)",    value: fmt(d.active_users_24h),   sub: "unique users" },
          { label: "Sessions",        value: fmt(d.total_sessions),     sub: `last ${d.days}d` },
          { label: "Article Clicks",  value: fmt(d.total_clicks),       sub: `last ${d.days}d` },
          { label: "Likes",           value: fmt(d.total_likes),        sub: `last ${d.days}d` },
        ];
        grid.innerHTML = cards.map(c => `
          <div class="stat-card">
            <span class="stat-label">${c.label}</span>
            <span class="stat-value">${c.value}</span>
            <span class="stat-sub">${c.sub}</span>
          </div>
        `).join("");
      }

      function renderTopTags(tags) {
        const list = document.getElementById("topTagsList");
        if (!tags.length) { list.innerHTML = '<li style="color:#7a9e87;font-size:0.85rem;">No tag data yet.</li>'; return; }
        const max = tags[0].clicks || 1;
        list.innerHTML = tags.map(t => `
          <li class="bar-item">
            <div class="bar-label-row">
              <span>${escHtml(t.tag)}</span>
              <span>${fmt(t.clicks)}</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill" style="width:${Math.round(t.clicks / max * 100)}%"></div>
            </div>
          </li>
        `).join("");
      }

      function renderTopArticles(articles) {
        const list = document.getElementById("topArticlesList");
        if (!articles.length) { list.innerHTML = '<li style="color:#7a9e87;font-size:0.85rem;">No article data yet.</li>'; return; }
        list.innerHTML = articles.map((a, i) => `
          <li class="article-rank-item">
            <span class="rank-num">#${i + 1}</span>
            <span class="rank-title">${escHtml(a.title || "Untitled")}</span>
            <span class="rank-meta">
              <span title="clicks">&#128065; ${fmt(a.clicks)}</span>
              <span title="likes">&#10084; ${fmt(a.likes)}</span>
            </span>
          </li>
        `).join("");
      }

      // ── Users table ────────────────────────────────────────────────
      async function loadUsers() {
        const tableBody = document.getElementById("tableBody");
        tableBody.innerHTML = '<div class="loading">Loading users…</div>';

        try {
          const res = await fetch(`/api/metrics/admin/users?days=${currentDays}&limit=200`, {
            headers: authHeaders(),
          });
          if (res.status === 403) return; // already handled by summary
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          usersData = data.users || [];
        } catch (err) {
          tableBody.innerHTML = `<div class="error-msg">Failed to load users: ${err.message}</div>`;
          return;
        }

        renderTable();
      }

      const COL_DEFS = [
        { key: "name",                  label: "Name",        fmt: v => escHtml(v || "—") },
        { key: "email",                 label: "Email",       fmt: v => escHtml(v || "—") },
        { key: "role",                  label: "Role",        fmt: v => `<span class="role-badge ${v}">${escHtml(v || "user")}</span>` },
        { key: "last_seen_at",          label: "Last Seen",   fmt: v => v ? relTime(v) : "—" },
        { key: "total_sessions",        label: "Sessions",    fmt: v => fmt(v) },
        { key: "total_active_seconds",  label: "Active Time", fmt: v => fmtDuration(v) },
        { key: "total_clicks",          label: "Clicks",      fmt: v => fmt(v) },
        { key: "total_likes",           label: "Likes",       fmt: v => fmt(v) },
      ];

      function renderTable() {
        const tableBody = document.getElementById("tableBody");

        // Sort
        const sorted = [...usersData].sort((a, b) => {
          const av = a[sortKey], bv = b[sortKey];
          if (av == null && bv == null) return 0;
          if (av == null) return 1;
          if (bv == null) return -1;
          if (typeof av === "string") return sortDir === "asc" ? av.localeCompare(bv) : bv.localeCompare(av);
          return sortDir === "asc" ? av - bv : bv - av;
        });

        const thead = COL_DEFS.map(c => {
          const cls = c.key === sortKey ? (sortDir === "asc" ? "sort-asc" : "sort-desc") : "";
          return `<th class="${cls}" data-key="${c.key}">${c.label}</th>`;
        }).join("");

        let tbody = "";
        if (sorted.length === 0) {
          tbody = `<tr class="empty-row"><td colspan="${COL_DEFS.length}">No users found.</td></tr>`;
        } else {
          sorted.forEach(u => {
            const isExp = u.user_id === expandedUserId;
            tbody += `<tr data-uid="${u.user_id}" class="${isExp ? "expanded" : ""}">
              ${COL_DEFS.map(c => `<td>${c.fmt(u[c.key])}</td>`).join("")}
            </tr>`;
            if (isExp) {
              tbody += `<tr class="detail-row" data-uid="${u.user_id}">
                <td colspan="${COL_DEFS.length}">
                  <div class="detail-panel" id="detail-${u.user_id}">
                    <div class="loading">Loading detail…</div>
                  </div>
                </td>
              </tr>`;
            }
          });
        }

        tableBody.innerHTML = `
          <table>
            <thead><tr>${thead}</tr></thead>
            <tbody>${tbody}</tbody>
          </table>
        `;

        // Sort click handlers
        tableBody.querySelectorAll("thead th").forEach(th => {
          th.addEventListener("click", () => {
            const key = th.dataset.key;
            if (sortKey === key) {
              sortDir = sortDir === "asc" ? "desc" : "asc";
            } else {
              sortKey = key;
              sortDir = key === "name" || key === "email" ? "asc" : "desc";
            }
            renderTable();
            if (expandedUserId !== null) loadUserDetail(expandedUserId);
          });
        });

        // Row click → expand/collapse
        tableBody.querySelectorAll("tbody tr[data-uid]:not(.detail-row)").forEach(tr => {
          tr.addEventListener("click", () => {
            const uid = parseInt(tr.dataset.uid, 10);
            if (expandedUserId === uid) {
              expandedUserId = null;
              renderTable();
            } else {
              expandedUserId = uid;
              renderTable();
              loadUserDetail(uid);
            }
          });
        });

        // If there's already an expanded user, load their detail
        if (expandedUserId !== null) {
          loadUserDetail(expandedUserId);
        }
      }

      // ── User detail panel ──────────────────────────────────────────
      async function loadUserDetail(userId) {
        const panel = document.getElementById(`detail-${userId}`);
        if (!panel) return;
        panel.innerHTML = '<div class="loading">Loading…</div>';

        let data;
        try {
          const res = await fetch(`/api/metrics/admin/users/${userId}?days=${currentDays}`, {
            headers: authHeaders(),
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          data = await res.json();
        } catch (err) {
          panel.innerHTML = `<div class="error-msg">Failed to load user detail: ${err.message}</div>`;
          return;
        }

        panel.innerHTML = `
          <div>
            <p class="detail-section-title">Daily Activity (clicks)</p>
            ${renderMiniChart(data.daily || [])}
          </div>
          <div>
            <p class="detail-section-title">Top Articles</p>
            ${renderDetailArticles(data.top_articles || [])}
          </div>
          <div>
            <p class="detail-section-title">Recent Sessions</p>
            ${renderSessions(data.recent_sessions || [])}
          </div>
        `;
      }

      function renderMiniChart(daily) {
        if (!daily.length) return '<p style="color:#7a9e87;font-size:0.8rem;">No activity data.</p>';
        const maxClicks = Math.max(...daily.map(d => d.clicks || 0), 1);
        const bars = daily.map(d => {
          const h = Math.max(2, Math.round((d.clicks || 0) / maxClicks * 48));
          return `<div class="mini-bar" style="height:${h}px" data-tip="${d.date}: ${d.clicks} clicks"></div>`;
        }).join("");
        return `<div class="mini-chart">${bars}</div>`;
      }

      function renderDetailArticles(articles) {
        if (!articles.length) return '<p style="color:#7a9e87;font-size:0.8rem;">No article data.</p>';
        return `<ol class="article-rank-list">${articles.slice(0, 5).map((a, i) => `
          <li class="article-rank-item">
            <span class="rank-num">#${i + 1}</span>
            <span class="rank-title">${escHtml(a.title || "Untitled")}</span>
            <span class="rank-meta">
              <span>&#128065; ${fmt(a.clicks)}</span>
              <span>&#10084; ${fmt(a.likes)}</span>
            </span>
          </li>
        `).join("")}</ol>`;
      }

      function renderSessions(sessions) {
        if (!sessions.length) return '<p style="color:#7a9e87;font-size:0.8rem;">No sessions.</p>';
        return `<ul class="session-list">${sessions.slice(0, 10).map(s => `
          <li class="session-item">
            <div>${fmtDuration(s.active_seconds)} active</div>
            <div class="session-time">${fmtDateTime(s.started_at)}</div>
          </li>
        `).join("")}</ul>`;
      }

      // ── Error banner ───────────────────────────────────────────────
      function showError(msg) {
        const b = document.getElementById("errorBanner");
        b.textContent = msg;
        b.hidden = false;
      }

      // ── Utilities ──────────────────────────────────────────────────
      function fmt(n) {
        if (n == null) return "0";
        return Number(n).toLocaleString();
      }

      function fmtDuration(secs) {
        if (!secs) return "0s";
        const h = Math.floor(secs / 3600);
        const m = Math.floor((secs % 3600) / 60);
        const s = secs % 60;
        if (h > 0) return `${h}h ${m}m`;
        if (m > 0) return `${m}m ${s}s`;
        return `${s}s`;
      }

      function relTime(iso) {
        if (!iso) return "—";
        const diff = Date.now() - new Date(iso + (iso.endsWith("Z") ? "" : "Z")).getTime();
        const mins = Math.floor(diff / 60000);
        if (mins < 2) return "just now";
        if (mins < 60) return `${mins}m ago`;
        const hrs = Math.floor(mins / 60);
        if (hrs < 24) return `${hrs}h ago`;
        const days = Math.floor(hrs / 24);
        if (days < 30) return `${days}d ago`;
        return new Date(iso).toLocaleDateString();
      }

      function fmtDateTime(iso) {
        if (!iso) return "—";
        return new Date(iso + (iso.endsWith("Z") ? "" : "Z")).toLocaleString();
      }

      function escHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      // ── Boot ───────────────────────────────────────────────────────
      loadAll();
    </script>
  </body>
</html>
